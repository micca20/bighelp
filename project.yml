name: Bighelp
options:
  minimumXcodeGenVersion: 2.43.0
# Team ID and service keys come from Config/Local.xcconfig (git-ignored).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
packages:
  BuzzKit:
    path: Vendor/BuzzKit
  ThinkingOrbsKit:
    path: Packages/ThinkingOrbsKit
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
  # Same WebRTC with visionOS builds; its Objective-C classes carry an LK prefix.
  LiveKitWebRTC:
    url: https://github.com/livekit/webrtc-xcframework.git
    revision: c73deceaddd9c07293871ae28f24d4326cc86d62
targets:
  Bighelp:
    type: application
    platform: auto
    # Native on Vision Pro too (spatial avatar), not the iPad app in a window.
    supportedDestinations: [iOS, visionOS]
    sources:
      - path: Bighelp
        excludes:
          - GeneratedMedia/README.md
          - GitHub/README.md
          - Resources/Fonts/FONT-PROVENANCE.md
          - Resources/ProviderLogos-PROVENANCE.md
          - Watch/COMPANION_HANDOFF.md
          - Wiki/INTEGRATION.md
      - path: BighelpActivityShared
      - path: BighelpWatchShared
    dependencies:
      - target: BighelpWatch
        embed: true
        destinationFilters: [iOS]
      - target: BighelpNotificationService
        embed: true
        destinationFilters: [iOS]
      - target: BighelpLiveActivity
        embed: true
        destinationFilters: [iOS]
      - package: ThinkingOrbsKit
      - package: WebRTC
        destinationFilters: [iOS]
      - package: LiveKitWebRTC
        destinationFilters: [visionOS]
      - package: BuzzKit
        product: BuzzKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile
        PRODUCT_NAME: Bighelp
        # Surface snapping and room persistence for the spatial avatar need 26.
        XROS_DEPLOYMENT_TARGET: "26.0"
        # The Vision Pro simulator runs only on Apple silicon; LiveKit ships no Intel slice.
        EXCLUDED_ARCHS[sdk=xrsimulator*]: x86_64
        # Vision Pro needs its own layered icon (same art: cream back, orb front).
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xros*]: AppIconVision
        ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xrsimulator*]: AppIconVision
        # Vision Pro opens extra windows (the agent in the room). iPhone and iPad
        # keep one window, so only the visionOS Info.plist gains a scene manifest.
        GENERATE_INFOPLIST_FILE[sdk=xros*]: YES
        GENERATE_INFOPLIST_FILE[sdk=xrsimulator*]: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=xros*]: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation[sdk=xrsimulator*]: YES
        INFOPLIST_KEY_UIApplicationPreferredDefaultSceneSessionRole[sdk=xros*]: UIWindowSceneSessionRoleApplication
        INFOPLIST_KEY_UIApplicationPreferredDefaultSceneSessionRole[sdk=xrsimulator*]: UIWindowSceneSessionRoleApplication
        MARKETING_VERSION: 2.3.0
        CURRENT_PROJECT_VERSION: 29
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Bighelp/Bighelp.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Bighelp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          BIGHELP_APS_ENVIRONMENT: development
        Release:
          BIGHELP_APS_ENVIRONMENT: production
  BighelpWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: BighelpWatch
      - path: BighelpWatchShared
      - path: Bighelp/Link/BighelpLinkCrypto.swift
      - path: Bighelp/Link/BighelpLinkCredentials.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.watchkitapp
        PRODUCT_NAME: BighelpWatch
        MARKETING_VERSION: 2.3.0
        CURRENT_PROJECT_VERSION: 29
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BighelpWatch/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 4
  BighelpNotificationService:
    type: app-extension
    platform: iOS
    dependencies:
      - package: BuzzKit
        product: BuzzKitNotificationServiceExtension
    sources:
      - path: BighelpNotificationService
      - path: Bighelp/NotificationShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.notification-service
        PRODUCT_NAME: BighelpNotificationService
        MARKETING_VERSION: 2.3.0
        CURRENT_PROJECT_VERSION: 29
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: BighelpNotificationService/BighelpNotificationService.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BighelpNotificationService/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  BighelpLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: BighelpLiveActivity
      - path: BighelpActivityShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.live-activity
        PRODUCT_NAME: BighelpLiveActivity
        MARKETING_VERSION: 2.3.0
        CURRENT_PROJECT_VERSION: 29
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BighelpLiveActivity/Info.plist
        CODE_SIGN_ENTITLEMENTS: BighelpLiveActivity/BighelpLiveActivity.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  BighelpMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: BighelpMac
      - path: Bighelp/SharedFoundation
        excludes:
          - BighelpFoundationSessionRecordProjection.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.desktop
        MARKETING_VERSION: 2.3.0
        CURRENT_PROJECT_VERSION: 29
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  BighelpMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: BighelpMacTests
    dependencies:
      - target: BighelpMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.desktop.tests
        GENERATE_INFOPLIST_FILE: YES
  BighelpTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BighelpTests
    dependencies:
      - target: Bighelp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
  BighelpUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BighelpUITests
    dependencies:
      - target: Bighelp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
  BighelpVisionUITests:
    type: bundle.ui-testing
    platform: visionOS
    deploymentTarget: "26.0"
    sources:
      - path: BighelpVisionUITests
    dependencies:
      - target: Bighelp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.vision-uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  BighelpMac:
    shared: true
    build:
      targets:
        BighelpMac: all
    test:
      targets:
        - BighelpMacTests
  Bighelp:
    shared: true
    build:
      targets:
        Bighelp: all
        BighelpNotificationService: all
        BighelpLiveActivity: all
    test:
      targets:
        - BighelpTests
        - BighelpUITests
  BighelpWatch:
    shared: true
    build:
      targets:
        BighelpWatch: all
  BighelpVision:
    shared: true
    build:
      targets:
        Bighelp: all
    test:
      targets:
        - BighelpVisionUITests
