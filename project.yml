name: Loopdy
options:
  minimumXcodeGenVersion: 2.43.0
# Team ID and service keys come from Config/Local.xcconfig (git-ignored).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
packages:
  BuzzKit:
    path: Vendor/BuzzKit
  ThinkingOrbsKit:
    path: Packages/ThinkingOrbsKit
  WebRTC:
    url: https://github.com/stasel/WebRTC.git
    exactVersion: 153.0.0
targets:
  Loopdy:
    type: application
    platform: iOS
    sources:
      - path: Loopdy
        excludes:
          - GeneratedMedia/README.md
          - GitHub/README.md
          - Resources/Fonts/FONT-PROVENANCE.md
          - Resources/ProviderLogos-PROVENANCE.md
          - Watch/COMPANION_HANDOFF.md
          - Wiki/INTEGRATION.md
      - path: LoopdyActivityShared
      - path: LoopdyWatchShared
      - path: plugins/loopdy/model-names.json
        buildPhase: resources
    dependencies:
      - target: LoopdyWatch
        embed: true
      - target: LoopdyNotificationService
        embed: true
      - target: LoopdyLiveActivity
        embed: true
      - package: ThinkingOrbsKit
      - package: WebRTC
      - package: BuzzKit
        product: BuzzKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile
        PRODUCT_NAME: Loopdy
        MARKETING_VERSION: 2.3.0
        CURRENT_PROJECT_VERSION: 18
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Loopdy/Loopdy.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Loopdy/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          LOOPDY_APS_ENVIRONMENT: development
        Release:
          LOOPDY_APS_ENVIRONMENT: production
  LoopdyWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: LoopdyWatch
      - path: LoopdyWatchShared
      - path: Loopdy/Link/LoopdyLinkCrypto.swift
      - path: Loopdy/Link/LoopdyLinkCredentials.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.watchkitapp
        PRODUCT_NAME: LoopdyWatch
        MARKETING_VERSION: 2.3.0
        CURRENT_PROJECT_VERSION: 18
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LoopdyWatch/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: 4
  LoopdyNotificationService:
    type: app-extension
    platform: iOS
    dependencies:
      - package: BuzzKit
        product: BuzzKitNotificationServiceExtension
    sources:
      - path: LoopdyNotificationService
      - path: Loopdy/NotificationShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.notification-service
        PRODUCT_NAME: LoopdyNotificationService
        MARKETING_VERSION: 2.3.0
        CURRENT_PROJECT_VERSION: 18
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: LoopdyNotificationService/LoopdyNotificationService.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LoopdyNotificationService/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  LoopdyLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: LoopdyLiveActivity
      - path: LoopdyActivityShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.live-activity
        PRODUCT_NAME: LoopdyLiveActivity
        MARKETING_VERSION: 2.3.0
        CURRENT_PROJECT_VERSION: 18
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LoopdyLiveActivity/Info.plist
        CODE_SIGN_ENTITLEMENTS: LoopdyLiveActivity/LoopdyLiveActivity.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
  LoopdyMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: LoopdyMac
      - path: Loopdy/SharedFoundation
        excludes:
          - LoopdyFoundationSessionRecordProjection.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.desktop
        MARKETING_VERSION: 2.3.0
        CURRENT_PROJECT_VERSION: 18
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  LoopdyMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: LoopdyMacTests
    dependencies:
      - target: LoopdyMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.desktop.tests
        GENERATE_INFOPLIST_FILE: YES
  LoopdyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LoopdyTests
    dependencies:
      - target: Loopdy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
  LoopdyUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LoopdyUITests
    dependencies:
      - target: Loopdy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.loopdy.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LoopdyMac:
    shared: true
    build:
      targets:
        LoopdyMac: all
    test:
      targets:
        - LoopdyMacTests
  Loopdy:
    shared: true
    build:
      targets:
        Loopdy: all
        LoopdyNotificationService: all
        LoopdyLiveActivity: all
    test:
      targets:
        - LoopdyTests
        - LoopdyUITests
  LoopdyWatch:
    shared: true
    build:
      targets:
        LoopdyWatch: all
