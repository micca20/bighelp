<svg class="bh-avatar bh-av--lobster" data-character="lobster" data-state="idle" data-bg="on" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pinch the lobster"><title>Pinch the lobster</title><style>.bh-avatar{overflow:visible;-webkit-tap-highlight-color:transparent}.bh-avatar *{transform-box:fill-box;transform-origin:center}.bh-avatar .pv{transform-box:view-box}.bh-avatar [transform]{transform-box:view-box;transform-origin:0 0}.bh-avatar .bh-bg{fill:var(--bg)}.bh-avatar[data-bg="off"] .bh-bg{display:none}.bh-avatar .bh-shadow{fill:var(--ink);fill-opacity:.14;animation:bh-shadow 3.2s ease-in-out infinite}.bh-avatar .p{fill:var(--p)}.bh-avatar .s{fill:var(--s)}.bh-avatar .a{fill:var(--a)}.bh-avatar .k{fill:var(--ink)}.bh-avatar .w{fill:#fff}.bh-avatar .sk{fill:var(--skin)}.bh-avatar .sh{fill:#000;fill-opacity:.13}.bh-avatar .hl{fill:#fff;fill-opacity:.35}.bh-avatar .cr{fill:#FFF7EC}.bh-avatar .au{fill:#FFC940}.bh-avatar .pk{fill:#FF7F98}.bh-avatar .hb{fill:#F7F7FC}.bh-avatar .wg{fill:#FBFCFF;stroke:var(--ink);stroke-opacity:.22;stroke-width:1.4;stroke-linejoin:round}.bh-avatar .smk{fill:#fff;fill-opacity:.95;stroke:var(--ink);stroke-opacity:.18;stroke-width:1.4}.bh-avatar .blush{fill:#FF5C8A;fill-opacity:.28}.bh-avatar .st-p{fill:none;stroke:var(--p);stroke-linecap:round;stroke-linejoin:round}.bh-avatar .st-s{fill:none;stroke:var(--s);stroke-linecap:round;stroke-linejoin:round}.bh-avatar .st-a{fill:none;stroke:var(--a);stroke-linecap:round;stroke-linejoin:round}.bh-avatar .st-k{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}.bh-avatar .st-sk{fill:none;stroke:var(--skin);stroke-linecap:round;stroke-linejoin:round}.bh-avatar .st-hb{fill:none;stroke:#F7F7FC;stroke-linecap:round;stroke-linejoin:round}.bh-avatar .st-sh{fill:none;stroke:#000;stroke-opacity:.13;stroke-linecap:round;stroke-linejoin:round}.bh-avatar .butt{stroke-linecap:butt}.bh-avatar .bh-rig{transform-origin:100px 182px;animation:bh-breathe 3.2s ease-in-out infinite}.bh-avatar .bh-body{transform-origin:100px 182px;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}.bh-avatar .bh-eye{animation:bh-blink 4.8s infinite}.bh-avatar .bh-look{translate:calc(var(--lx,0) * var(--look,3px)) calc(var(--ly,0) * var(--look,3px));transition:translate .2s ease-out}.bh-avatar .bh-talk{transform-origin:50% 0}.bh-avatar .bh-eyes,.bh-avatar .bh-eyes-happy,.bh-avatar .bh-eyes-sleep,.bh-avatar .bh-smile,.bh-avatar .bh-talk,.bh-avatar .bh-grin,.bh-avatar .bh-fx>g,.bh-avatar .bh-ring{transition:opacity .18s}.bh-avatar .bh-eyes-happy,.bh-avatar .bh-eyes-sleep,.bh-avatar .bh-talk,.bh-avatar .bh-grin,.bh-avatar .bh-fx>g,.bh-avatar .bh-ring{opacity:0}.bh-avatar .bh-ring circle{fill:none;stroke:var(--p);stroke-width:3;animation:bh-ring 1.8s ease-out infinite}.bh-avatar .bh-ring circle+circle{animation-delay:.9s}.bh-avatar .fxb{fill:#fff;stroke:var(--ink);stroke-opacity:.18;stroke-width:1.5}.bh-avatar .bh-fx-think{transform-origin:136px 68px;transform:scale(.4);transition:opacity .18s,transform .3s cubic-bezier(.3,1.5,.5,1)}.bh-avatar .bh-fx-think .d{animation:bh-dot 1.2s ease-in-out infinite}.bh-avatar .bh-fx-think .d2{animation-delay:.18s}.bh-avatar .bh-fx-think .d3{animation-delay:.36s}.bh-avatar .bh-fx-zzz text{fill:#fff;stroke:var(--ink);stroke-width:2.4;paint-order:stroke;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:800;animation:bh-z 2.7s ease-in-out infinite}.bh-avatar .bh-fx-zzz text:nth-child(2){animation-delay:.9s}.bh-avatar .bh-fx-zzz text:nth-child(3){animation-delay:1.8s}.bh-avatar .bh-fx-sparkle path{fill:var(--a);stroke:var(--ink);stroke-opacity:.25;stroke-width:1.2;animation:bh-twinkle 1.6s ease-in-out infinite}.bh-avatar .bh-fx-sparkle path:nth-child(2){animation-delay:.4s}.bh-avatar .bh-fx-sparkle path:nth-child(3){animation-delay:.8s}.bh-avatar .bh-fx-sparkle path:nth-child(4){animation-delay:1.2s}/* listening */.bh-avatar[data-state="listening"] .bh-body{transform:rotate(5deg)}.bh-avatar[data-state="listening"] .bh-ring{opacity:1}/* thinking */.bh-avatar[data-state="thinking"] .bh-body{transform:rotate(-4deg)}.bh-avatar[data-state="thinking"] .bh-look{translate:calc(var(--look,3px) * .7) calc(var(--look,3px) * -1)}.bh-avatar[data-state="thinking"] .bh-fx-think{opacity:1;transform:scale(1)}/* talking */.bh-avatar[data-state="talking"] .bh-smile{opacity:0}.bh-avatar[data-state="talking"] .bh-talk{opacity:1;animation:bh-talk .3s ease-in-out infinite alternate}.bh-avatar[data-state="talking"] .bh-rig{animation:bh-chatter .6s ease-in-out infinite alternate}/* happy */.bh-avatar[data-state="happy"] .bh-eyes,.bh-avatar[data-state="happy"] .bh-smile{opacity:0}.bh-avatar[data-state="happy"] .bh-eyes-happy,.bh-avatar[data-state="happy"] .bh-grin,.bh-avatar[data-state="happy"] .bh-fx-sparkle{opacity:1}.bh-avatar[data-state="happy"] .bh-rig{animation:bh-hop .8s cubic-bezier(.35,0,.4,1) infinite}.bh-avatar[data-state="happy"] .bh-shadow{animation:bh-hop-shadow .8s cubic-bezier(.35,0,.4,1) infinite}/* sleeping */.bh-avatar[data-state="sleeping"] .bh-eyes{opacity:0}.bh-avatar[data-state="sleeping"] .bh-eyes-sleep,.bh-avatar[data-state="sleeping"] .bh-fx-zzz{opacity:1}.bh-avatar[data-state="sleeping"] .bh-rig{animation:bh-breathe 5s ease-in-out infinite}.bh-avatar[data-state="sleeping"] .bh-body{transform:rotate(-3deg)}.bh-avatar[data-state="sleeping"] .anim{animation:none}/* waiting: blocked on the user */.bh-avatar[data-state="waiting"] .bh-look{animation:bh-scan 2.6s ease-in-out infinite}.bh-avatar[data-state="waiting"] .bh-body{animation:bh-sway 2.6s ease-in-out infinite}.bh-avatar[data-state="waiting"] .bh-fx-wait{opacity:1}.bh-avatar .fxw{fill:var(--a);stroke:var(--ink);stroke-opacity:.3;stroke-width:1.5}.bh-avatar .bh-fx-wait .badge{animation:bh-pulse 1.3s ease-in-out infinite}/* tap reaction (JS adds .bh-poke) */.bh-avatar.bh-poke .bh-body{animation:bh-squish .55s cubic-bezier(.3,1.5,.5,1)}@keyframes bh-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes bh-shadow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.92)}}@keyframes bh-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}@keyframes bh-talk{0%{transform:scaleY(.3)}100%{transform:scaleY(1)}}@keyframes bh-chatter{0%{transform:translateY(0) rotate(-1deg)}100%{transform:translateY(-2px) rotate(1deg)}}@keyframes bh-hop{0%,100%{transform:translateY(0) scale(1.04,.96)}45%{transform:translateY(-9px) scale(.98,1.02)}}@keyframes bh-hop-shadow{0%,100%{transform:scaleX(1.05)}45%{transform:scaleX(.78)}}@keyframes bh-ring{0%{transform:scale(.9);opacity:.75}100%{transform:scale(1.04);opacity:0}}@keyframes bh-dot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-3px);opacity:1}}@keyframes bh-z{0%{opacity:0;transform:translate(0,4px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(7px,-12px) scale(1.1)}}@keyframes bh-twinkle{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}@keyframes bh-scan{0%,100%{translate:calc(var(--look,3px) * -1) 0}50%{translate:var(--look,3px) 0}}@keyframes bh-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes bh-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes bh-squish{0%{transform:scale(1,1)}25%{transform:scale(1.1,.88)}55%{transform:scale(.95,1.06)}100%{transform:scale(1,1)}}@media (prefers-reduced-motion:reduce){.bh-avatar *{animation:none!important;transition:none!important}}.bh-av--lobster{--p:var(--av-primary,#E8553E);--s:var(--av-secondary,#FFC3A9);--a:var(--av-accent,#FFD166);--bg:var(--av-bg,#FFEAE3);--ink:var(--av-ink,#2A2238);--skin:var(--av-skin,#F6CFB0)}.bh-av--lobster .lob-ant-l{transform-origin:91px 76px;animation:lob-ant 3.4s ease-in-out infinite}.bh-av--lobster .lob-ant-r{transform-origin:109px 76px;animation:lob-ant 3.4s ease-in-out infinite reverse}.bh-av--lobster .lob-claw{transform-origin:68px 118px;animation:lob-wave 3.2s ease-in-out infinite}.bh-av--lobster .lob-pinch{transform-origin:52px 82px;animation:lob-pinch 4.2s ease-in-out infinite}.bh-av--lobster[data-state="talking"] .lob-claw{animation-duration:1.2s}.bh-av--lobster[data-state="happy"] .lob-pinch{animation:lob-snap .4s ease-in-out infinite alternate}.bh-av--lobster[data-state="happy"] .lob-claw{animation:lob-cheer .8s ease-in-out infinite}@keyframes lob-ant{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(5deg)}}@keyframes lob-wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-7deg)}}@keyframes lob-pinch{0%,62%,100%{transform:rotate(0)}68%,72%{transform:rotate(-20deg)}78%{transform:rotate(0)}84%{transform:rotate(-20deg)}90%{transform:rotate(0)}}@keyframes lob-snap{to{transform:rotate(-20deg)}}@keyframes lob-cheer{0%,100%{transform:rotate(0)}45%{transform:rotate(12deg)}}</style><circle class="bh-bg" cx="100" cy="100" r="96"/><g class="bh-ring"><circle cx="100" cy="100" r="88"/><circle cx="100" cy="100" r="88"/></g><ellipse class="bh-shadow" cx="100" cy="184" rx="44" ry="6"/><g class="bh-rig pv"><g class="bh-body pv"><g class="pv anim lob-ant-l"><path class="st-p" stroke-width="4" d="M91 76 C 85 46, 72 30, 48 24"/><circle class="a" cx="48" cy="24" r="4.5"/></g><g class="pv anim lob-ant-r"><path class="st-p" stroke-width="4" d="M109 76 C 115 46, 128 30, 152 24"/><circle class="a" cx="152" cy="24" r="4.5"/></g><path class="st-p" stroke-width="6" d="M70 140 L55 150"/><path class="st-p" stroke-width="6" d="M72 151 L59 163"/><g transform="matrix(-1 0 0 1 200 0)"><path class="st-p" stroke-width="6" d="M70 140 L55 150"/><path class="st-p" stroke-width="6" d="M72 151 L59 163"/></g><ellipse class="p" cx="85" cy="167" rx="11" ry="9"/><ellipse class="sh" cx="85" cy="167" rx="11" ry="9"/><ellipse class="p" cx="115" cy="167" rx="11" ry="9"/><ellipse class="sh" cx="115" cy="167" rx="11" ry="9"/><ellipse class="p" cx="100" cy="171" rx="12" ry="9"/><g class="pv anim lob-claw"><path class="st-p" stroke-width="12" d="M68 118 Q 52 112 46 96"/><g clas