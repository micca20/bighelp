 class="w" cx="118" cy="54" rx="10.5" ry="11.5"/><g class="bh-look"><circle class="k" cx="118" cy="54" r="6.4"/><circle class="w" cx="120.19" cy="51.81" r="2.3"/><circle class="w" cx="115.93" cy="56.53" r="1.04" opacity=".7"/></g></g></g><g class="bh-eyes-happy"><path class="st-k" stroke-width="3.6" d="M75 56.1 Q82 48 89 56.1"/><path class="st-k" stroke-width="3.6" d="M111 56.1 Q118 48 125 56.1"/></g><g class="bh-eyes-sleep"><path class="st-k" stroke-width="3.6" d="M75 54 Q82 58.2 89 54"/><path class="st-k" stroke-width="3.6" d="M111 54 Q118 58.2 125 54"/></g><g class="bh-mouth"><g class="bh-smile"><path class="st-k" stroke-width="3.2" d="M92 97 Q100 105 108 97"/></g><g class="bh-talk"><ellipse class="k" cx="100" cy="101.8" rx="5.12" ry="5.12"/><ellipse class="pk" cx="100" cy="104.36" rx="2.88" ry="1.6"/></g><g class="bh-grin"><path class="k" d="M90.4 96 Q100 112.68 109.6 96 Z"/><ellipse class="pk" cx="100" cy="102.28" rx="3.52" ry="1.6"/></g></g><g class="bh-blush"><ellipse class="blush" cx="76" cy="101" rx="6.5" ry="4"/><ellipse class="blush" cx="124" cy="101" rx="6.5" ry="4"/></g></g></g><g class="bh-fx"><g class="bh-fx-think pv"><circle class="fxb" cx="137" cy="66" r="3.4"/><circle class="fxb" cx="145" cy="56" r="4.8"/><ellipse class="fxb" cx="158" cy="41" rx="18" ry="12.5"/><circle class="k d d1" cx="151" cy="41" r="2.5"/><circle class="k d d2" cx="158" cy="41" r="2.5"/><circle class="k d d3" cx="165" cy="41" r="2.5"/></g><g class="bh-fx-zzz"><text x="140" y="62" font-size="18">Z</text><text x="153" y="46" font-size="14">z</text><text x="163" y="33" font-size="11">z</text></g><g class="bh-fx-wait"><g class="badge"><circle class="fxw" cx="158" cy="42" r="13"/><rect class="k" x="156" y="33" width="4" height="11.5" rx="2"/><circle class="k" cx="158" cy="49" r="2.3"/></g></g><g class="bh-fx-sparkle"><path d="M36 42 Q36 50 44 50 Q36 50 36 58 Q36 50 28 50 Q36 50 36 42 Z"/><path d="M166 51 Q166 58 173 58 Q166 58 166 65 Q166 58 159 58 Q166 58 166 51 Z"/><path d="M162 1