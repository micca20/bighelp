<svg class="bh-avatar bh-av--messenger" data-character="messenger" data-state="idle" data-bg="on" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aeria the winged messenger"><title>Aeria the winged messenger</title><style>.bh-avatar{overflow:visible;-webkit-tap-highlight-color:transparent}.bh-avatar *{transform-box:fill-box;transform-origin:center}.bh-avatar .pv{transform-box:view-box}.bh-avatar [transform]{transform-box:view-box;transform-origin:0 0}.bh-avatar .bh-bg{fill:var(--bg)}.bh-avatar[data-bg="off"] .bh-bg{display:none}.bh-avatar .bh-shadow{fill:var(--ink);fill-opacity:.14;animation:bh-shadow 3.2s ease-in-out infinite}.bh-avatar .p{fill:var(--p)}.bh-avatar .s{fill:var(--s)}.bh-avatar .a{fill:var(--a)}.bh-avatar .k{fill:var(--ink)}.bh-avatar .w{fill:#fff}.bh-avatar .sk{fill:var(--skin)}.bh-avatar .sh{fill:#000;fill-opacity:.13}.bh-avatar .hl{fill:#fff;fill-opacity:.35}.bh-avatar .cr{fill:#FFF7EC}.bh-avatar .au{fill:#FFC940}.bh-avatar .pk{fill:#FF7F98}.bh-avatar .hb{fill:#F7F7FC}.bh-avatar .wg{fill:#FBFCFF;stroke:var(--ink);stroke-opacity:.22;stroke-width:1.4;stroke-linejoin:round}.bh-avatar .smk{fill:#fff;fill-opacity:.95;stroke:var(--ink);stroke-opacity:.18;stroke-width:1.4}.bh-avatar .blush{fill:#FF5C8A;fill-opacity:.28}.bh-avatar .st-p{fill:none;stroke:var(--p);stroke-linecap:round;stroke-linejoin:round}.bh-avatar .st-s{fill:none;stroke:var(--s);stroke-linecap:round;stroke-linejoin:round}.bh-avatar .st-a{fill:none;stroke:var(--a);stroke-linecap:round;stroke-linejoin:round}.bh-avatar .st-k{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}.bh-avatar .st-sk{fill:none;stroke:var(--skin);stroke-linecap:round;stroke-linejoin:round}.bh-avatar .st-hb{fill:none;stroke:#F7F7FC;stroke-linecap:round;stroke-linejoin:round}.bh-avatar .st-sh{fill:none;stroke:#000;stroke-opacity:.13;stroke-linecap:round;stroke-linejoin:round}.bh-avatar .butt{stroke-linecap:butt}.bh-avatar .bh-rig{transform-origin:100px 182px;animation:bh-breathe 3.2s ease-in-out infinite}.bh-avatar .bh-body{transform-origin:100px 182px;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}.bh-avatar .bh-eye{animation:bh-blink 4.8s infinite}.bh-avatar .bh-look{translate:calc(var(--lx,0) * var(--look,3px)) calc(var(--ly,0) * var(--look,3px));transition:translate .2s ease-out}.bh-avatar .bh-talk{transform-origin:50% 0}.bh-avatar .bh-eyes,.bh-avatar .bh-eyes-happy,.bh-avatar .bh-eyes-sleep,.bh-avatar .bh-smile,.bh-avatar .bh-talk,.bh-avatar .bh-grin,.bh-avatar .bh-fx>g,.bh-avatar .bh-ring{transition:opacity .18s}.bh-avatar .bh-eyes-happy,.bh-avatar .bh-eyes-sleep,.bh-avatar .bh-talk,.bh-avatar .bh-grin,.bh-avatar .bh-fx>g,.bh-avatar .bh-ring{opacity:0}.bh-avatar .bh-ring circle{fill:none;stroke:var(--p);stroke-width:3;animation:bh-ring 1.8s ease-out infinite}.bh-avatar .bh-ring circle+circle{animation-delay:.9s}.bh-avatar .fxb{fill:#fff;stroke:var(--ink);stroke-opacity:.18;stroke-width:1.5}.bh-avatar .bh-fx-think{transform-origin:136px 68px;transform:scale(.4);transition:opacity .18s,transform .3s cubic-bezier(.3,1.5,.5,1)}.bh-avatar .bh-fx-think .d{animation:bh-dot 1.2s ease-in-out infinite}.bh-avatar .bh-fx-think .d2{animation-delay:.18s}.bh-avatar .bh-fx-think .d3{animation-delay:.36s}.bh-avatar .bh-fx-zzz text{fill:#fff;stroke:var(--ink);stroke-width:2.4;paint-order:stroke;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:800;animation:bh-z 2.7s ease-in-out infinite}.bh-avatar .bh-fx-zzz text:nth-child(2){animation-delay:.9s}.bh-avatar .bh-fx-zzz text:nth-child(3){animation-delay:1.8s}.bh-avatar .bh-fx-sparkle path{fill:var(--a);stroke:var(--ink);stroke-opacity:.25;stroke-width:1.2;animation:bh-twinkle 1.6s ease-in-out infinite}.bh-avatar .bh-fx-sparkle path:nth-child(2){animation-delay:.4s}.bh-avatar .bh-fx-sparkle path:nth-child(3){animation-delay:.8s}.bh-avatar .bh-fx-sparkle path:nth-child(4){animation-delay:1.2s}/* listening */.bh-avatar[data-state="listening"] .bh-body{transform:rotate(5deg)}.bh-avatar[data-state="listening"] .bh-ring{opacity:1}/* thinking */.bh-avatar[data-state="thinking"] .bh-body{transform:rotate(-4deg)}.bh-avatar[data-state="thinking"] .bh-look{translate:calc(var(--look,3px) * .7) calc(var(--look,3px) * -1)}.bh-avatar[data-state="thinking"] .bh-fx-think{opacity:1;transform:scale(1)}/* talking */.bh-avatar[data-state="talking"] .bh-smile{opacity:0}.bh-avatar[data-state="talking"] .bh-talk{opacity:1;animation:bh-talk .3s ease-in-out infinite alternate}.bh-avatar[data-state="talking"] .bh-rig{animation:bh-chatter .6s ease-in-out infinite alternate}/* happy */.bh-avatar[data-state="happy"] .bh-eyes,.bh-avatar[data-state="happy"] .bh-smile{opacity:0}.bh-avatar[data-state="happy"] .bh-eyes-happy,.bh-avatar[data-state="happy"] .bh-grin,.bh-avatar[data-state="happy"] .bh-fx-sparkle{opacity:1}.bh-avatar[data-state="happy"] .bh-rig{animation:bh-hop .8s cubic-bezier(.35,0,.4,1) infinite}.bh-avatar[data-state="happy"] .bh-shadow{animation:bh-hop-shadow .8s cubic-bezier(.35,0,.4,1) infinite}/* sleeping */.bh-avatar[data-state="sleeping"] .bh-eyes{opacity:0}.bh-avatar[data-state="sleeping"] .bh-eyes-sleep,.bh-avatar[data-state="sleeping"] .bh-fx-zzz{opacity:1}.bh-avatar[data-state="sleeping"] .bh-rig{animation:bh-breathe 5s ease-in-out infinite}.bh-avatar[data-state="sleeping"] .bh-body{transform:rotate(-3deg)}.bh-avatar[data-state="sleeping"] .anim{animation:none}/* waiting: blocked on the user */.bh-avatar[data-state="waiting"] .bh-look{animation:bh-scan 2.6s ease-in-out infinite}.bh-avatar[data-state="waiting"] .bh-body{animation:bh-sway 2.6s ease-in-out infinite}.bh-avatar[data-state="waiting"] .bh-fx-wait{opacity:1}.bh-avatar .fxw{fill:var(--a);stroke:var(--ink);stroke-opacity:.3;stroke-width:1.5}.bh-avatar .bh-fx-wait .badge{animation:bh-pulse 1.3s ease-in-out infinite}/* tap reaction (JS adds .bh-poke) */.bh-avatar.bh-poke .bh-body{animation:bh-squish .55s cubic-bezier(.3,1.5,.5,1)}@keyframes bh-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes bh-shadow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.92)}}@keyframes bh-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}@keyframes bh-talk{0%{transform:scaleY(.3)}100%{transform:scaleY(1)}}@keyframes bh-chatter{0%{transform:translateY(0) rotate(-1deg)}100%{transform:translateY(-2px) rotate(1deg)}}@keyframes bh-hop{0%,100%{transform:translateY(0) scale(1.04,.96)}45%{transform:translateY(-9px) scale(.98,1.02)}}@keyframes bh-hop-shadow{0%,100%{transform:scaleX(1.05)}45%{transform:scaleX(.78)}}@keyframes bh-ring{0%{transform:scale(.9);opacity:.75}100%{transform:scale(1.04);opacity:0}}@keyframes bh-dot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-3px);opacity:1}}@keyframes bh-z{0%{opacity:0;transform:translate(0,4px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(7px,-12px) scale(1.1)}}@keyframes bh-twinkle{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}@keyframes bh-scan{0%,100%{translate:calc(var(--look,3px) * -1) 0}50%{translate:var(--look,3px) 0}}@keyframes bh-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes bh-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes bh-squish{0%{transform:scale(1,1)}25%{transform:scale(1.1,.88)}55%{transform:scale(.95,1.06)}100%{transform:scale(1,1)}}@media (prefers-reduced-motion:reduce){.bh-avatar *{animation:none!important;transition:none!important}}.bh-av--messenger{--p:var(--av-primary,#5B6CFF);--s:var(--av-secondary,#3B2B55);--a:var(--av-accent,#FFC94A);--bg:var(--av-bg,#E8EBFF);--ink:var(--av-ink,#2A2238);--skin:var(--av-skin,#F7D0B5)}.bh-av--messenger{--look:2px}.bh-av--messenger .msg-wing{transform-origin:62px 74px;animation:msg-flap 3.6s ease-in-out infinite}.bh-av--messenger .msg-lock{transform-origin:66px 90px;animation:msg-sway 3.2s ease-in-out infinite}.bh-av--messenger[data-state="happy"] .msg-wing{animation:msg-flutter .3s ease-in-out infinite alternate}.bh-av--messenger[data-state="talking"] .msg-wing{animation-duration:1.6s}@keyframes msg-flap{0%,58%,100%{transform:rotate(0)}64%{transform:rotate(-14deg)}70%{transform:rotate(2deg)}76%{transform:rotate(-14deg)}82%{transform:rotate(0)}}@keyframes msg-sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(3deg)}}@keyframes msg-flutter{from{transform:rotate(2deg)}to{transform:rotate(-16deg)}}</style><circle class="bh-bg" cx="100" cy="100" r="96"/><g class="bh-ring"><circle cx="100" cy="100" r="88"/><circle cx="100" cy="100" r="88"/></g><ellipse class="bh-shadow" cx="100" cy="184" rx="44" ry="6"/><g class="bh-rig pv"><g class="bh-body pv"><ellipse class="s" cx="100" cy="88" rx="46" ry="46"/><path class="p" d="M56 180 C 56 158, 74 146, 100 146 C 126 146, 144 158, 144 180 Q 100 188 56 180 Z"/><path class="sh" d="M128 152 C 138 158, 144 168, 144 180 Q 136 182 126 183 C 130 172, 130 160, 128 152 Z"/><ellipse class="hl" cx="72" cy="160" rx="8" ry="4" transform="rotate(-25 72 160)"/><rect class="sk" x="91" y="122" width="18" height="28" rx="6"/><rect class="sh" x="91" y="124" width="18" height="10" rx="3"/><path class="sk" d="M88 147 Q 100 145 112 147 L 100 162 Z"/><path class="st-a" stroke-width="3" d="M86 147 L100 163 L114 147"/><path class="st-a" stroke-width="6" d="M70 152 L 130 178"/><rect class="au" x="95.5" y="160" width="10" height="9" rx="2" transform="rotate(23 100.5 164.5)"/><g class="pv anim msg-lock"><path class="s" d="M58 86 C 50 112, 50 136, 62 158 C 70 146, 76 126, 76 100 Z"/></g><g transform="matrix(-1 0 0 1 200 0)"><g class="pv anim msg-lock"><path class="s" d="M58 86 C 50 112, 50 136, 62 158 C 70 146, 76 126, 76 100 Z"/></g></g><ellipse class="sk" cx="63" cy="97" rx="6" ry="8"/><ellipse class="sk" cx="137" cy="97" rx="6" ry="8"/><circle class="sk" cx="100" cy="90" r="38"/><path class="st-s" stroke-width="2.6" d="M78 85 Q85 81 92 84"/><path class="st-s" stroke-width="2.6" d="M108 84 Q115 81 122 