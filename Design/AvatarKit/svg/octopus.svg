<svg class="bh-avatar bh-av--octopus" data-character="octopus" data-state="idle" data-bg="on" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Inky the octopus"><title>Inky the octopus</title><style>.bh-avatar{overflow:visible;-webkit-tap-highlight-color:transparent}.bh-avatar *{transform-box:fill-box;transform-origin:center}.bh-avatar .pv{transform-box:view-box}.bh-avatar [transform]{transform-box:view-box;transform-origin:0 0}.bh-avatar .bh-bg{fill:var(--bg)}.bh-avatar[data-bg="off"] .bh-bg{display:none}.bh-avatar .bh-shadow{fill:var(--ink);fill-opacity:.14;animation:bh-shadow 3.2s ease-in-out infinite}.bh-avatar .p{fill:var(--p)}.bh-avatar .s{fill:var(--s)}.bh-avatar .a{fill:var(--a)}.bh-avatar .k{fill:var(--ink)}.bh-avatar .w{fill:#fff}.bh-avatar .sk{fill:var(--skin)}.bh-avatar .sh{fill:#000;fill-opacity:.13}.bh-avatar .hl{fill:#fff;fill-opacity:.35}.bh-avatar .cr{fill:#FFF7EC}.bh-avatar .au{fill:#FFC940}.bh-avatar .pk{fill:#FF7F98}.bh-avatar .hb{fill:#F7F7FC}.bh-avatar .wg{fill:#FBFCFF;stroke:var(--ink);stroke-opacity:.22;stroke-width:1.4;stroke-linejoin:round}.bh-avatar .smk{fill:#fff;fill-opacity:.95;stroke:var(--ink);stroke-opacity:.18;stroke-width:1.4}.bh-avatar .blush{fill:#FF5C8A;fill-opacity:.28}.bh-avatar .st-p{fill:none;stroke:var(--p);stroke-linecap:round;stroke-linejoin:round}.bh-avatar .st-s{fill:none;stroke:var(--s);stroke-linecap:round;stroke-linejoin:round}.bh-avatar .st-a{fill:none;stroke:var(--a);stroke-linecap:round;stroke-linejoin:round}.bh-avatar .st-k{fill:none;stroke:var(--ink);stroke-linecap:round;stroke-linejoin:round}.bh-avatar .st-sk{fill:none;stroke:var(--skin);stroke-linecap:round;stroke-linejoin:round}.bh-avatar .st-hb{fill:none;stroke:#F7F7FC;stroke-linecap:round;stroke-linejoin:round}.bh-avatar .st-sh{fill:none;stroke:#000;stroke-opacity:.13;stroke-linecap:round;stroke-linejoin:round}.bh-avatar .butt{stroke-linecap:butt}.bh-avatar .bh-rig{transform-origin:100px 182px;animation:bh-breathe 3.2s ease-in-out infinite}.bh-avatar .bh-body{transform-origin:100px 182px;transition:transform .45s cubic-bezier(.3,1.3,.5,1)}.bh-avatar .bh-eye{animation:bh-blink 4.8s infinite}.bh-avatar .bh-look{translate:calc(var(--lx,0) * var(--look,3px)) calc(var(--ly,0) * var(--look,3px));transition:translate .2s ease-out}.bh-avatar .bh-talk{transform-origin:50% 0}.bh-avatar .bh-eyes,.bh-avatar .bh-eyes-happy,.bh-avatar .bh-eyes-sleep,.bh-avatar .bh-smile,.bh-avatar .bh-talk,.bh-avatar .bh-grin,.bh-avatar .bh-fx>g,.bh-avatar .bh-ring{transition:opacity .18s}.bh-avatar .bh-eyes-happy,.bh-avatar .bh-eyes-sleep,.bh-avatar .bh-talk,.bh-avatar .bh-grin,.bh-avatar .bh-fx>g,.bh-avatar .bh-ring{opacity:0}.bh-avatar .bh-ring circle{fill:none;stroke:var(--p);stroke-width:3;animation:bh-ring 1.8s ease-out infinite}.bh-avatar .bh-ring circle+circle{animation-delay:.9s}.bh-avatar .fxb{fill:#fff;stroke:var(--ink);stroke-opacity:.18;stroke-width:1.5}.bh-avatar .bh-fx-think{transform-origin:136px 68px;transform:scale(.4);transition:opacity .18s,transform .3s cubic-bezier(.3,1.5,.5,1)}.bh-avatar .bh-fx-think .d{animation:bh-dot 1.2s ease-in-out infinite}.bh-avatar .bh-fx-think .d2{animation-delay:.18s}.bh-avatar .bh-fx-think .d3{animation-delay:.36s}.bh-avatar .bh-fx-zzz text{fill:#fff;stroke:var(--ink);stroke-width:2.4;paint-order:stroke;font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:800;animation:bh-z 2.7s ease-in-out infinite}.bh-avatar .bh-fx-zzz text:nth-child(2){animation-delay:.9s}.bh-avatar .bh-fx-zzz text:nth-child(3){animation-delay:1.8s}.bh-avatar .bh-fx-sparkle path{fill:var(--a);stroke:var(--ink);stroke-opacity:.25;stroke-width:1.2;animation:bh-twinkle 1.6s ease-in-out infinite}.bh-avatar .bh-fx-sparkle path:nth-child(2){animation-delay:.4s}.bh-avatar .bh-fx-sparkle path:nth-child(3){animation-delay:.8s}.bh-avatar .bh-fx-sparkle path:nth-child(4){animation-delay:1.2s}/* listening */.bh-avatar[data-state="listening"] .bh-body{transform:rotate(5deg)}.bh-avatar[data-state="listening"] .bh-ring{opacity:1}/* thinking */.bh-avatar[data-state="thinking"] .bh-body{transform:rotate(-4deg)}.bh-avatar[data-state="thinking"] .bh-look{translate:calc(var(--look,3px) * .7) calc(var(--look,3px) * -1)}.bh-avatar[data-state="thinking"] .bh-fx-think{opacity:1;transform:scale(1)}/* talking */.bh-avatar[data-state="talking"] .bh-smile{opacity:0}.bh-avatar[data-state="talking"] .bh-talk{opacity:1;animation:bh-talk .3s ease-in-out infinite alternate}.bh-avatar[data-state="talking"] .bh-rig{animation:bh-chatter .6s ease-in-out infinite alternate}/* happy */.bh-avatar[data-state="happy"] .bh-eyes,.bh-avatar[data-state="happy"] .bh-smile{opacity:0}.bh-avatar[data-state="happy"] .bh-eyes-happy,.bh-avatar[data-state="happy"] .bh-grin,.bh-avatar[data-state="happy"] .bh-fx-sparkle{opacity:1}.bh-avatar[data-state="happy"] .bh-rig{animation:bh-hop .8s cubic-bezier(.35,0,.4,1) infinite}.bh-avatar[data-state="happy"] .bh-shadow{animation:bh-hop-shadow .8s cubic-bezier(.35,0,.4,1) infinite}/* sleeping */.bh-avatar[data-state="sleeping"] .bh-eyes{opacity:0}.bh-avatar[data-state="sleeping"] .bh-eyes-sleep,.bh-avatar[data-state="sleeping"] .bh-fx-zzz{opacity:1}.bh-avatar[data-state="sleeping"] .bh-rig{animation:bh-breathe 5s ease-in-out infinite}.bh-avatar[data-state="sleeping"] .bh-body{transform:rotate(-3deg)}.bh-avatar[data-state="sleeping"] .anim{animation:none}/* waiting: blocked on the user */.bh-avatar[data-state="waiting"] .bh-look{animation:bh-scan 2.6s ease-in-out infinite}.bh-avatar[data-state="waiting"] .bh-body{animation:bh-sway 2.6s ease-in-out infinite}.bh-avatar[data-state="waiting"] .bh-fx-wait{opacity:1}.bh-avatar .fxw{fill:var(--a);stroke:var(--ink);stroke-opacity:.3;stroke-width:1.5}.bh-avatar .bh-fx-wait .badge{animation:bh-pulse 1.3s ease-in-out infinite}/* tap reaction (JS adds .bh-poke) */.bh-avatar.bh-poke .bh-body{animation:bh-squish .55s cubic-bezier(.3,1.5,.5,1)}@keyframes bh-breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes bh-shadow{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.92)}}@keyframes bh-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}@keyframes bh-talk{0%{transform:scaleY(.3)}100%{transform:scaleY(1)}}@keyframes bh-chatter{0%{transform:translateY(0) rotate(-1deg)}100%{transform:translateY(-2px) rotate(1deg)}}@keyframes bh-hop{0%,100%{transform:translateY(0) scale(1.04,.96)}45%{transform:translateY(-9px) scale(.98,1.02)}}@keyframes bh-hop-shadow{0%,100%{transform:scaleX(1.05)}45%{transform:scaleX(.78)}}@keyframes bh-ring{0%{transform:scale(.9);opacity:.75}100%{transform:scale(1.04);opacity:0}}@keyframes bh-dot{0%,60%,100%{transform:translateY(0);opacity:.45}30%{transform:translateY(-3px);opacity:1}}@keyframes bh-z{0%{opacity:0;transform:translate(0,4px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(7px,-12px) scale(1.1)}}@keyframes bh-twinkle{0%,100%{transform:scale(.2) rotate(0);opacity:0}50%{transform:scale(1) rotate(45deg);opacity:1}}@keyframes bh-scan{0%,100%{translate:calc(var(--look,3px) * -1) 0}50%{translate:var(--look,3px) 0}}@keyframes bh-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}@keyframes bh-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}@keyframes bh-squish{0%{transform:scale(1,1)}25%{transform:scale(1.1,.88)}55%{transform:scale(.95,1.06)}100%{transform:scale(1,1)}}@media (prefers-reduced-motion:reduce){.bh-avatar *{animation:none!important;transition:none!important}}.bh-av--octopus{--p:var(--av-primary,#FF6F91);--s:var(--av-secondary,#FFD1DC);--a:var(--av-accent,#5CE1E6);--bg:var(--av-bg,#FFEAF0);--ink:var(--av-ink,#2A2238);--skin:var(--av-skin,#F6CFB0)}.bh-av--octopus{--look:3px}.bh-av--octopus .oct-t{animation:oct-wave 2.6s ease-in-out infinite alternate}.bh-av--octopus[data-state="happy"] .oct-t{animation-duration:.5s}.bh-av--octopus[data-state="talking"] .oct-t{animation-duration:1.2s}.bh-av--octopus .oct-b{opacity:0;animation:oct-bub 3.6s ease-in infinite}.bh-av--octopus .oct-b2{animation-delay:-1.2s}.bh-av--octopus .oct-b3{animation-delay:-2.4s}@keyframes oct-wave{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}@keyframes oct-bub{0%{transform:translateY(12px) scale(.5);opacity:0}20%{opacity:.9}100%{transform:translateY(-34px) scale(1);opacity:0}}</style><circle class="bh-bg" cx="100" cy="100" r="96"/><g class="bh-ring"><circle cx="100" cy="100" r="88"/><circle cx="100" cy="100" r="88"/></g><ellipse class="bh-shadow" cx="100" cy="184" rx="44" ry="6"/><g class="bh-rig pv"><g class="bh-body pv"><g class="pv anim oct-t" style="transform-origin:74px 118px;animation-delay:0s"><path class="st-p" stroke-width="13" d="M74 118 C 58 136, 44 146, 34 136 C 28 130, 32 122, 40 124"/><path class="st-sh" stroke-width="13" d="M74 118 C 58 136, 44 146, 34 136 C 28 130, 32 122, 40 124"/></g><g class="pv anim oct-t" style="transform-origin:126px 118px;animation-delay:-1.3s"><path class="st-p" stroke-width="13" d="M126 118 C 142 136, 156 146, 166 136 C 172 130, 168 122, 160 124"/><path class="st-sh" stroke-width="13" d="M126 118 C 142 136, 156 146, 166 136 C 172 130, 168 122, 160 124"/></g><g class="pv anim oct-t" style="transform-origin:84px 124px;animation-delay:-0.6s"><path class="st-p" stroke-width="13" d="M84 124 C 78 146, 72 162, 58 166 C 50 168, 48 160, 54 156"/></g><g class="pv anim oct-t" style="transform-origin:116px 124px;animation-delay:-1.9s"><path class="st-p" stroke-width="13" d="M116 124 C 122 146, 128 162, 142 166 C 150 168, 152 160, 146 156"/></g><g class="pv anim oct-t" style="transform-origin:95px 128px;animation-delay:-0.9s"><path class="st-p" stroke-width="13" d="M95 128 C 95 150, 92 168, 82 176 C 76 180, 72 174, 76 170"/></g><g class="pv anim oct-t" style="transform-origin:105px 128px;animation-delay:-2.2s"><path class="st-p" stroke-width="13" d="M105 128 C 105 150, 108 168, 118 176 C 124 180, 128 174, 124 170"/></g><path class="p" d="M52 104 C 52 62, 74 38, 100 38 C 126 38, 148 62, 148 104 C 148 124, 128 134, 100 134 C 72 134, 52 124, 52 104 Z"/><path class="sh" d="M132 56 C 144 70, 148 86, 148 104 C 148 124, 128 134, 100 134 C 118 128, 136 118, 138 100 C 140 84, 138 68, 132 56 Z"/><ellipse class="hl" cx="77" cy="60" rx="11" ry="7" transform="rotate(-35 77 60)"/><circle class="s" cx="121" cy="55" r="5" opacity=".75"/><circle class="s" cx="133" cy="70" r="3.2" opacity=".75"/><circle class="s" cx="111" cy="46" r="2.8" opacity=".75"/><g class="bh-eyes"><g class="bh-eye"><ellipse class="w" cx="84" cy="95" rx="10" ry="11"/><g class="bh-look"><circle class="k" cx="84" cy="95" r="6.5"/><circle class="w" cx="86.22" cy="92.78" r="2.34"/><circle class="w" cx="81.89" cy="97.57" r="1.05" opacity=".7"/></g></g><g class="bh-eye"><ellipse class="w" cx="116" cy="95" rx="10" ry="11"/><g class="bh-look"><circle class="k" cx="116" cy="95" r="6.5"/><circle class="w" cx="118.22" cy="92.78" r="2.34"/><circle class="w" cx="113.89" cy="97.57" r="1.05" opacity=".7"/></g></g></g><g class="bh-eyes-happy"><path class="st-k" stroke-width="3.6" d="M77 97.1 Q84 89 91 97.1"/><path class="st-k" stroke-width="3.6" d="M109 97.1 Q116 89 123 97.1"/></g><g class="bh-eyes-sleep"><path class="st-k" stroke-width="3.6" d="M77 95 Q84 99.2 91 95"/><path class="st-k" stroke-width="3.6" d="M109 95 Q116 99.2 123 95"/></g><g class="bh-mouth"><g class="bh-smile"><path class="st-k" stroke-width="3.2" d="M93.5 113 Q100 119.5 106.5 113"/></g><g class="bh-talk"><ellipse class="k" cx="100" cy="116.9" rx="4.16" ry="4.16"/><ellipse class="pk" cx="100" cy="118.98" rx="2.34" ry="1.3"/></g><g class="bh-grin"><path class="k" d="M92.2 112 Q100 125.74 107.8 112 Z"/><ellipse class="pk" cx="100" cy="117.29" rx="2.86" ry="1.3"/></g></g><g class="bh-blush"><ellipse class="blush" cx="70" cy="109" rx="6.5" ry="4"/><ellipse class="blush" cx="130" cy="109" rx="6.5" ry="4"/></g><g class="oct-bubbles"><circle class="st-a anim oct-b" stroke-width="2" cx="44" cy="80" r="4.5"/><circle class="st-a anim oct-b oct-b2" stroke-width="2" cx="36" cy="92" r="3"/><circle class="st-a anim oct-b oct-b3" stroke-width="2" cx="50" cy="94" r="3.6"/></g></g></g><g class="bh-fx"><g class="bh-fx-think pv"><circle class="fxb" cx="137" cy="66" r="3.4"/><circle class="fxb" cx="145" cy="56" r="4.8"/><ellipse class="fxb" cx="158" cy="41" rx="18" ry="12.5"/><circle class="k d d1" cx="151" cy="41" r="2.5"/><circle class="k d d2" cx="158" cy="41" r="2.5"/><circle class="k d d3" cx="165" cy="41" r="2.5"/></g><g class="bh-fx-zzz"><text x="140" y="62" font-size="18">Z</text><text x="153" y="46" font-size="14">z</text><text x="163" y="33" font-size="11">z</text></g><g class="bh-fx-wait"><g class="badge"><circle class="fxw" cx="158" cy="42" r="13"/><rect class="k" x="156" y="33" width="4" height="11.5" rx="2"/><circle class="k" cx="158" cy="49" r="2.3"/></g></g><g class="bh-fx-sparkle"><path d="M36 42 Q36 50 44 50 Q36 50 36 58 Q36 50 28 50 Q36 50 36 42 Z"/><path d="M166 51 Q166 58 173 58 Q166 58 166 65 Q166 58 159 58 Q166 58 166 51 Z"/><path d="M162 140 Q162 146 168 146 Q162 146 162 152 Q162 146 156 146 Q162 146 162 140 Z"/><path d="M34 132.5 Q34 138 39.5 138 Q34 138 34 143.5 Q34 138 28.5 138 Q34 138 34 132.5 Z"/></g></g></svg>
