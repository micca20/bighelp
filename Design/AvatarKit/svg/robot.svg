lass="a rob-bar b4" x="105.8" y="101" width="3.6" height="11" rx="1.8"/><rect class="a rob-bar b5" x="112.4" y="101" width="3.6" height="11" rx="1.8"/></g><g class="bh-grin"><path class="a" d="M88 102 Q100 117 112 102 Z"/></g></g><g class="bh-blush"><ellipse class="blush" cx="73" cy="104" rx="5" ry="3"/><ellipse class="blush" cx="127" cy="104" rx="5" ry="3"/></g><circle class="sh" cx="62" cy="58" r="2.2"/><circle class="sh" cx="138" cy="58" r="2.2"/></g></g><g class="bh-fx"><g class="bh-fx-think pv"><circle class="fxb" cx="137" cy="66" r="3.4"/><circle class="fxb" cx="145" cy="56" r="4.8"/><ellipse class="fxb" cx="158" cy="41" rx="18" ry="12.5"/><circle class="k d d1" cx="151" cy="41" r="2.5"/><circle class="k d d2" cx="158" cy="41" r="2.5"/><circle class="k d d3" cx="165" cy="41" r="2.5"/></g><g class="bh-fx-zzz"><text x="140" y="62" font-size="18">Z</text><text x="153" y="46" font-size="14">z</text><text x="163" y="33" font-size="11">z</text></g><g class="bh-fx-wait"><g class="badge"><circle class="fxw" cx="158" cy="42" r="13"/><rect class="k" x="156" y="33" width="4" height="11.5" rx="2"/><circle class="k" cx="158" cy="49" r="2.3"/></g></g><g class="bh-fx-sparkle"><path d="M36 42 Q36 50 44 50 Q36 50 36 58 Q36 50 28 50 Q36 50 36 42 Z"/><path d="M166 51 Q166 58 173 58 Q166 58 166 65 Q166 58 159 58 Q166 58 166 51 Z"/><path d="M162 140 Q162 146 168 146 Q162 146 162 152 Q162 146 156 146 Q162 146 162 140 Z"/><path d="M34 132.5 Q34 138 39.5 138 Q34 138 34 143.5 Q34 138 28.5 138 Q34 138 34 132.5 Z"/></g></g></svg>
